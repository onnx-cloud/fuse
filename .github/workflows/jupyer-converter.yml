name: Jupyer Converter CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - '*'

jobs:
  test-and-convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m uv pip install --upgrade pip
          uv pip install -r requirements.txt
          uv pip install -r requirements-dev.txt
          uv pip install -e '.[dev]'

      - name: Run tests
        run: pytest -q

      - name: Run Jupyer converter script
        run: python scripts/run_jupyer_converter.py

      - name: Upload generated notebook
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: jupyer-converter-notebook
          path: examples/jupyter/jupyer_converter.generated.ipynb
