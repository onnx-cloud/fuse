name: Jupyter Image & Notebook Smoke

on:
  push:
    branches: [ main, 'feature/jupyter-docker', '**' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  test:
    name: Run jupyter tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dev requirements
        run: |
          python -m uv pip install --upgrade pip
          uv pip install -r requirements-dev.txt

      - name: Run jupyter tests
        run: |
          pytest -q tests/jupyter -q

  packaging:
    name: Validate wheel packaging
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Build wheel
        run: |
          python -m pip install --upgrade pip setuptools wheel build
          python -m pip install uv
          python -m uv pip install --upgrade pip setuptools wheel build
          python -m build --wheel --outdir dist

      - name: Smoke import the built wheel
        run: |
          python -m uv pip install --upgrade pip
          python -m uv pip install --no-deps --no-cache-dir dist/*.whl
          python - << 'PY'
import importlib.util as iu
if iu.find_spec('src') is None:
    raise SystemExit('src package not importable from built wheel')
import src.jupyter
print('OK: src.jupyter importable')
PY

  build-and-smoke:
    name: Build Jupyter image and run smoke notebook
    runs-on: ubuntu-latest
    needs: [ test, packaging ]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build Jupyter production image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: docker/jupyter/Dockerfile
          push: false
          tags: fuse-jupyter:ci
          load: true

      - name: Check built labextension present in image
        run: |
          docker run --rm --entrypoint sh fuse-jupyter:ci -c "test -d /fused/labextensions/fuse/lib && ls -la /fused/labextensions/fuse/lib"

      - name: Run notebook smoke test
        run: |
          docker run --rm --entrypoint jupyter fuse-jupyter:ci nbconvert --to notebook --execute /fused/jupyter/notebooks/quick_fuse.ipynb --ExecutePreprocessor.timeout=120 --output /fused/jupyter/quick_fuse_executed.ipynb

      - name: Show executed notebook output (tail)
        run: |
          docker run --rm --entrypoint sh fuse-jupyter:ci -c "python - <<'PY'\nimport json,sys\nnb=json.load(open('/fused/jupyter/quick_fuse_executed.ipynb'))\nfor cell in nb.get('cells',[]):\n    for out in cell.get('outputs',[]):\n        if out.get('output_type')=='stream':\n            sys.stdout.write(out.get('text',''))\n        elif out.get('output_type')=='execute_result':\n            sys.stdout.write(str(out.get('data'))+'\n')\nPY" || true

      - name: Basic runtime check inside image
        run: |
          docker run --rm --entrypoint sh fuse-jupyter:ci -c "python - <<'PY'\nimport onnxruntime, sys\nprint('onnxruntime', onnxruntime.__version__)\nPY"
