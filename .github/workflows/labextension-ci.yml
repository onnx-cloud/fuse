name: Labextension CI

on:
  push:
  pull_request:

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    permissions: write-all
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Install npm deps and build extension
        working-directory: jupyter/labextensions/fuse
        run: |
          npm install
          npm run build
      - name: Run unit tests for extension
        working-directory: jupyter/labextensions/fuse
        run: |
          npm install
          npm test || echo "Tests may be placeholders; continuing"
      - name: Build Docker image
        run: |
          docker build -t fuse-jupyter-ci -f docker/jupyter/Dockerfile .
      - name: Run container, check health, and run papermill examples
        run: |
          CONTAINER_ID=$(docker run -d -p 8888:8888 fuse-jupyter-ci)
          echo "Waiting for server..."
          for i in {1..60}; do \
            if curl -sSf http://localhost:8888/fuse/api/health >/dev/null 2>&1; then break; fi; \
            sleep 1; \
          done
          curl -s http://localhost:8888/fuse/api/health | jq .
          # Run papermill inside the running container to execute two small notebooks
          docker exec $CONTAINER_ID bash -lc "uv pip install --no-cache-dir papermill || true"
          docker exec $CONTAINER_ID bash -lc "/workspace/scripts/run_examples_papermill.sh /tmp/artifacts"
          docker exec $CONTAINER_ID ls -l /tmp/artifacts || true
          docker stop $CONTAINER_ID || true
