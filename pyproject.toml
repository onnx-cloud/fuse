[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fuse"
version = "0.7.2"
readme = "README.md"

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["tests*"]

[tool.setuptools]
package-dir = {"" = "src"}

[project.entry-points."jupyter_server.server_extension"]
"fuse_server" = "src.jupyter.server:load_jupyter_server_extension"

[project.entry-points."console_scripts"]
"fuse-scaffold" = "scripts.scaffold_project:scaffold"
"fuse-install-kernel" = "src.jupyter.install:install_kernel"
"fuse-lsp" = "src.lsp_server:main"

[tool.setuptools.package-data]
"src.jupyter" = ["../jupyter/settings/**", "../jupyter/labextensions/**", "../jupyter/static/**"]
