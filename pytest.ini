[pytest]
testpaths = tests
python_files = test_*.py
addopts = -v --tb=short
filterwarnings =
    ignore::DeprecationWarning:lark.*
    ignore:.*datetime\.datetime\.utcnow.*:DeprecationWarning

# Custom markers
markers =
    smoke: quick smoke tests
    golden: tests that require larger datasets or onnx artifacts (skipped in smoke CI)
    slow: long-running tests